name: Public commentary pages

on:
  push:
    branches: [main]
    paths:
      - '_commentary/**'
      - 'enrichment/**'
      - 'commentary_pages/**'
      - '.github/workflows/commentary-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /commentary_pages/**
            /_commentary/v*/out*/**
            /_commentary/v*/result*/**
            /_commentary/v*/work/**
            /_commentary/v*/experiments/**
            /enrichment/v*/out/**
            /enrichment/v*/schema.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test generator
        run: python3 commentary_pages/test_build.py
      - name: Check reader JavaScript
        run: |
          cat commentary_pages/app.part*.jsfrag > /tmp/commentary-app.js
          node --check /tmp/commentary-app.js
      - name: Build public site
        run: python3 commentary_pages/build.py --root . --output commentary_pages/_site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: commentary_pages/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
